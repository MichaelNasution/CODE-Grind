<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrabble | Classic Casual Games</title>
  <link rel="stylesheet" href="../shared/styles/tokens.css">
  <link rel="stylesheet" href="../shared/styles/base.css">
  <link rel="stylesheet" href="../shared/styles/components.css">
  <link rel="stylesheet" href="../shared/styles/layout.css">
  <link rel="stylesheet" href="../shared/styles/animations.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="../index.html" aria-label="Back to game library">&lsaquo;</a>
  <main class="app-shell scrabble-shell modern">
    <div class="game-container">
      
      <!-- Left Column: Board and Racks -->
      <section class="left-col">
        <div class="board-wrapper">
          <!-- The board container will have coordinate labels injected by JS or CSS -->
          <div id="board" class="scrabble-board modern-board"></div>
        </div>
        
        <div class="racks-section">
          <!-- AI Rack (visible for debugging/request) -->
          <div class="rack-panel ai-rack-panel">
            <div class="rack-header"><p class="eyebrow">AI Rack</p></div>
            <div id="ai-rack" class="rack modern-rack"></div>
          </div>
          
          <div class="action-bar">
            <button class="btn icon-btn" id="btn-shuffle" title="Shuffle Rack">🔀</button>
            <button class="btn outline" id="btn-resign">Resign</button>
            <button class="btn outline" id="btn-skip">Skip</button>
            <button class="btn outline" id="btn-swap">Swap</button>
            <button class="btn primary" id="btn-submit">Submit</button>
            <button class="btn icon-btn" id="btn-recall" title="Recall Tiles">↩</button>
          </div>
          
          <div class="rack-panel player-rack-panel">
            <div class="rack-header"><p class="eyebrow">Your Rack</p></div>
            <div id="rack" class="rack modern-rack"></div>
          </div>
        </div>
      </section>

      <!-- Right Column: Info Panels -->
      <aside class="right-col">
        <div class="panel game-info-panel">
          <div class="top-info">
            <span id="status-title">Loading dictionary…</span> • <span id="status-copy">Downloading 149k words</span>
          </div>
          
          <div class="player-cards">
            <div class="player-card active" id="player-card">
              <div class="avatar">V</div>
              <div class="details">
                <span class="name">You</span>
                <span class="elo">Elo Score: 1500</span>
              </div>
              <strong class="score" id="player-score">0</strong>
            </div>
            <div class="player-card" id="ai-card">
              <div class="avatar">Z</div>
              <div class="details">
                <span class="name">ScrabbleBot</span>
                <span class="elo">Elo Score: 1298</span>
              </div>
              <strong class="score" id="ai-score">0</strong>
            </div>
          </div>
        </div>

        <div class="panel bag-panel">
          <div class="panel-header">
            <h3><span class="icon">💼</span> Tile Bag <span id="bag-count">100</span></h3>
            <div class="bag-stats">
              <span>Vowels: <strong id="vowels-count">42</strong></span>
              <span>Consonants: <strong id="consonants-count">56</strong></span>
            </div>
          </div>
          <div id="bag-grid" class="bag-grid">
            <!-- Rendered by JS -->
          </div>
        </div>

        <div class="panel history-panel">
          <div class="panel-header">
            <h3><span class="icon">📄</span> Turn History</h3>
          </div>
          <div class="history-content">
            <ul id="turn-history-list" class="turn-history-list">
              <li class="empty-state">There is no history to show</li>
            </ul>
          </div>
        </div>
        
        <!-- Game settings hidden or simplified -->
        <div class="settings-panel hidden">
            <!-- Kept for JS compatibility if needed -->
            <button id="submit-word" style="display:none"></button>
            <button id="ai-move" style="display:none"></button>
            <button id="clear-word" style="display:none"></button>
            <button id="new-game" style="display:none"></button>
            <span id="turn-label" style="display:none"></span>
            <span id="word-preview" style="display:none"></span>
            <span id="selected-score" style="display:none"></span>
            <span id="last-play" style="display:none"></span>
        </div>
      </aside>

    </div>
  </main>
  <script src="../shared/scripts/utils.js"></script>
  <script src="../shared/scripts/storage.js"></script>
  <script src="../shared/scripts/sound.js"></script>
  <script src="script/tile.js"></script>
  <script src="script/dictionary.js"></script>
  <script src="script/scoring.js"></script>
  <script src="script/rack.js"></script>
  <script src="script/board.js"></script>
  <script src="script/state.js"></script>
  <script src="script/game.js"></script>
  <script src="script/ai.js"></script>
  <script src="script/ui.js"></script>
</body>
</html>
