<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire | Classic Casual Games</title>
  <link rel="stylesheet" href="../shared/styles/tokens.css">
  <link rel="stylesheet" href="../shared/styles/base.css">
  <link rel="stylesheet" href="../shared/styles/components.css">
  <link rel="stylesheet" href="../shared/styles/layout.css">
  <link rel="stylesheet" href="../shared/styles/animations.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="../index.html" aria-label="Back to game library">‹</a>
  <main class="app-shell solitaire-shell">
    <section class="game-stage">
      <div class="topbar">
        <div><p class="eyebrow">card table</p><h1>Solitaire</h1></div>
        <div class="stat-grid">
          <article class="stat-card"><span>Score</span><strong id="score">0</strong></article>
          <article class="stat-card"><span>Moves</span><strong id="moves">0</strong></article>
          <article class="stat-card"><span>Best</span><strong id="best">0</strong></article>
        </div>
      </div>
      <div class="solitaire-layout">
        <aside class="panel control-panel">
          <div class="status-box"><span class="badge">Status</span><strong id="status-title">Ready</strong><p id="status-copy">Drag face-up cards to legal tableau or foundation piles.</p></div>
          <fieldset class="field-group">
            <legend>Mode</legend>
            <div class="segmented-control"><button class="segment active" data-mode="solo" aria-pressed="true">Solo</button><button class="segment" data-mode="race" aria-pressed="false">Race</button><button class="segment" data-mode="ai" aria-pressed="false">AI Assist</button></div>
          </fieldset>
          <fieldset class="field-group">
            <legend>AI level</legend>
            <div class="segmented-control"><button class="segment" data-difficulty="easy" aria-pressed="false">Easy</button><button class="segment active" data-difficulty="medium" aria-pressed="true">Medium</button><button class="segment" data-difficulty="hard" aria-pressed="false">Hard</button></div>
          </fieldset>
          <div class="toolbar"><button class="btn primary" id="new-game">New Game</button><button class="btn secondary" id="ai-move">AI Move</button><button class="btn ghost" id="auto-stack">Auto Stack</button></div>
        </aside>
        <section class="panel solitaire-table">
          <div class="top-piles">
            <button class="pile stock" id="stock">Stock</button>
            <div class="pile waste" id="waste" data-pile="waste"></div>
            <div class="foundation-row" id="foundations"></div>
          </div>
          <div class="tableau" id="tableau"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="../shared/scripts/utils.js"></script>
  <script src="../shared/scripts/storage.js"></script>
  <script src="../shared/scripts/sound.js"></script>
  <script src="script/state.js"></script>
  <script src="script/game.js"></script>
  <script src="script/ai.js"></script>
  <script src="script/ui.js"></script>
</body>
</html>
