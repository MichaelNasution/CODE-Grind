<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrabble | Classic Casual Games</title>
  <link rel="stylesheet" href="../shared/styles/tokens.css">
  <link rel="stylesheet" href="../shared/styles/base.css">
  <link rel="stylesheet" href="../shared/styles/components.css">
  <link rel="stylesheet" href="../shared/styles/layout.css">
  <link rel="stylesheet" href="../shared/styles/animations.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell scrabble-shell">
    <section class="game-stage">
      <div class="topbar">
        <div><p class="eyebrow">word strategy</p><h1>Scrabble</h1></div>
        <div class="stat-grid">
          <article class="stat-card"><span>You</span><strong id="player-score">0</strong></article>
          <article class="stat-card"><span>AI</span><strong id="ai-score">0</strong></article>
          <article class="stat-card"><span>Bag</span><strong id="bag-count">0</strong></article>
        </div>
      </div>
      <div class="scrabble-layout">
        <aside class="panel control-panel">
          <div class="status-box"><span class="badge">Status</span><strong id="status-title">Ready</strong><p id="status-copy">Select rack tiles, then choose a board start and direction.</p></div>
          <fieldset class="field-group"><legend>Mode</legend><div class="segmented-control"><button class="segment active" data-mode="ai" aria-pressed="true">Player vs AI</button><button class="segment" data-mode="local" aria-pressed="false">2 Players</button></div></fieldset>
          <fieldset class="field-group"><legend>AI level</legend><div class="segmented-control"><button class="segment" data-difficulty="easy" aria-pressed="false">Easy</button><button class="segment active" data-difficulty="medium" aria-pressed="true">Medium</button><button class="segment" data-difficulty="hard" aria-pressed="false">Hard</button></div></fieldset>
          <fieldset class="field-group"><legend>Direction</legend><div class="segmented-control"><button class="segment active" data-direction="horizontal" aria-pressed="true">Across</button><button class="segment" data-direction="vertical" aria-pressed="false">Down</button></div></fieldset>
          <div class="toolbar"><button class="btn primary" id="submit-word">Play Word</button><button class="btn secondary" id="ai-move">AI Move</button><button class="btn ghost" id="new-game">New Game</button><a class="btn ghost" href="../index.html">Library</a></div>
        </aside>
        <section class="panel scrabble-table">
          <div id="board" class="scrabble-board"></div>
          <div>
            <p class="eyebrow">rack</p>
            <div id="rack" class="rack"></div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="../shared/scripts/utils.js"></script>
  <script src="../shared/scripts/storage.js"></script>
  <script src="../shared/scripts/sound.js"></script>
  <script src="script/tile.js"></script>
  <script src="script/dictionary.js"></script>
  <script src="script/scoring.js"></script>
  <script src="script/rack.js"></script>
  <script src="script/board.js"></script>
  <script src="script/state.js"></script>
  <script src="script/game.js"></script>
  <script src="script/ai.js"></script>
  <script src="script/ui.js"></script>
</body>
</html>
